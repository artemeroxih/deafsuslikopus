<!--TITLE: DeafSuslik -->
<script>
  /* Флаг должен встать раньше, чем стартуют роутеры страниц: иначе каждый из
     трёх перепишет общий адрес под свой экран, и последний затрёт остальных. */
  window.DS_COMBINED = true;
  window.DS_BOOT_HASH = decodeURIComponent(location.hash.slice(1));
</script>

<style>
  /* Оболочка сводной сборки: шесть страниц в одном файле, одна ссылка на всё.
     Собственные стили страниц не трогаются — у оболочки свой префикс. */

  /* Хост артефактов подставляет свою светлую подложку: фон и схему полей
     страница должна назвать сама, иначе одолжит чужую. */
  :root { color-scheme: dark; }
  body { background: var(--ds-void); color: var(--ds-ink); }

  .al__bar {
    position: sticky; top: 0; z-index: 900;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px;
    background: rgba(8,16,38,.88); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--ds-line);
  }
  .al__logo { display: flex; align-items: center; flex: 0 0 auto; }
  .al__tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .al__tabs::-webkit-scrollbar { display: none; }
  .al__tab {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px;
    border: 1px solid transparent; background: transparent;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ds-ink-2);
    cursor: pointer; white-space: nowrap;
    transition: background var(--ds-m-base) var(--ds-ease), color var(--ds-m-base) var(--ds-ease);
  }
  .al__tab:hover { color: var(--ds-ink); background: var(--ds-raised); }
  .al__tab[aria-selected="true"] {
    background: var(--ds-raised-3); border-color: var(--ds-amber-edge); color: var(--ds-amber);
  }
  .al__page[hidden] { display: none !important; }

  @media (max-width: 760px) {
    .al__bar { padding: 8px 12px; gap: 10px; }
    .al__logo { display: none; }
  }
</style>

<nav class="al__bar">
  <span class="al__logo" id="alLogo"></span>
  <div class="al__tabs" id="alTabs" role="tablist"></div>
</nav>

<!--PAGES-->

<script>
(function () {
  var TABS = [
    ['index',  'Обзор'],
    ['flow',   'Путь зрителя'],
    ['system', 'Дизайн-система'],
    ['web',    'Веб'],
    ['mobile', 'iPhone и Android'],
    ['admin',  'Админ-панель']
  ];

  // Установленное приложение — витрина продукта. Админ-панель в него не входит:
  // таймлайн субтитров, очередь обработки и таблицы прав рассчитаны на большой
  // экран и мышь. Ссылки на неё из карты пути остаются — они объясняют почему.
  var STANDALONE = matchMedia('(display-mode: standalone)').matches ||
                   matchMedia('(display-mode: fullscreen)').matches ||
                   navigator.standalone === true;
  if (STANDALONE) TABS = TABS.filter(function (t) { return t[0] !== 'admin'; });

  var bar = document.getElementById('alTabs');
  document.getElementById('alLogo').innerHTML = dsLogo(22, 14);
  bar.innerHTML = TABS.map(function (t) {
    return '<button class="al__tab" role="tab" data-page="' + t[0] + '" aria-selected="false">' + t[1] + '</button>';
  }).join('');

  function section(name) { return document.querySelector('.al__page[data-page="' + name + '"]'); }

  function show(name, screen) {
    // Перебираем разделы, а не вкладки: у раздела вкладки может не быть —
    // в установленном приложении админка живёт без неё, чтобы ссылка из
    // карты пути приводила к объяснению, а не в тишину.
    var target = section(name);
    if (!target) return;

    document.querySelectorAll('.al__page').forEach(function (el) {
      el.hidden = el !== target;
    });
    bar.querySelectorAll('.al__tab').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.page === name);
    });

    // Прототип, который был скрыт, мерил себя по нулевой ширине —
    // после показа пересчитываем размеры и перезапускаем фон.
    window.dispatchEvent(new Event('resize'));
    if (window.DSAurora) DSAurora.mount(target);

    if (screen && window.DSGO && DSGO[name]) DSGO[name](screen);

    try { history.replaceState(null, '', '#' + name + (screen ? '/' + screen : '')); } catch (e) {}
    window.scrollTo(0, 0);
  }

  bar.addEventListener('click', function (ev) {
    var b = ev.target.closest('.al__tab');
    if (b) show(b.dataset.page);
  });

  // Внутренние ссылки вида web.html#player раньше вели на соседний файл.
  // В одном файле соседних файлов нет — ведём их на нужную вкладку и экран.
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[href]');
    if (!a) return;
    var m = /^([a-z-]+)\.html(?:#(.+))?$/.exec(a.getAttribute('href') || '');
    if (!m) return;
    if (!section(m[1])) return;
    ev.preventDefault();
    show(m[1], m[2] ? decodeURIComponent(m[2]) : null);
  });

  if (STANDALONE) {
    var adm = document.querySelector('.al__page[data-page="admin"]');
    if (adm) {
      var here = location.href.replace(/[^\/]*(?:[?#].*)?$/, 'admin.html');
      // Разметку не удаляем, а прячем: роутер админки слушает resize и на
      // каждом переключении вкладки полез бы в элементы, которых уже нет.
      Array.prototype.forEach.call(adm.children, function (c) { c.hidden = true; });
      adm.insertAdjacentHTML('beforeend',
        '<div style="max-width:560px;margin:0 auto;padding:72px 24px">' +
          '<div class="ds-card">' +
            '<span class="ds-badge">Только для компьютера</span>' +
            '<h2 class="ds-h1" style="margin-top:14px">Админ-панель не входит в приложение</h2>' +
            '<p class="ds-body" style="margin-top:12px">Таймлайн-редактор субтитров, очередь ' +
              'обработки видео и таблицы прав рассчитаны на большой экран и мышь. Уместить их ' +
              'в телефон можно, но работать в них станет нельзя — поэтому мы этого не делаем.</p>' +
            '<p class="ds-sm" style="margin-top:14px">Откройте на компьютере:<br>' +
              '<a href="' + here + '" style="color:var(--ds-accent);word-break:break-all">' + here + '</a></p>' +
          '</div></div>');
      // Разметки админки больше нет — её роутер трогать нельзя, иначе
      // ссылка из карты пути упадёт в консоль вместо объяснения.
      if (window.DSGO) delete DSGO.admin;
    }
  }

  var h = (window.DS_BOOT_HASH || '').split('/');
  show(section(h[0]) ? h[0] : 'index', h[1] || null);
})();
</script>
